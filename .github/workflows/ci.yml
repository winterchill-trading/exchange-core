name: ci
on: [push, pull_request]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Two packages live here and exchange-core-engine depends on order-book,
      # which depends on exchange-core, so `--deps-only` over both opam files
      # would need exchange-core installed first. The cached switch is built
      # for the engine's opam file alone (exchange-core and order-book come in
      # as pins); afterwards exchange-core is re-pinned to this checkout, which
      # rebuilds order-book against it, and only the engine package is built so
      # dune uses the installed copy instead of seeing two exchange-core
      # libraries.
      - run: mkdir -p _ox-engine && cp exchange-core-engine.opam _ox-engine/
      - uses: winterchill-trading/infra/.github/actions/ox-setup@main
        with:
          working-directory: _ox-engine
          pins: |
            fixed-decimal https://github.com/winterchill-trading/fixed-decimal.git
            exchange-core https://github.com/winterchill-trading/exchange-core.git
            order-book https://github.com/winterchill-trading/order-book.git
      - run: opam pin add exchange-core . --yes
      - run: opam exec -- dune build --only-packages exchange-core-engine @install
      - run: opam exec -- dune build --only-packages exchange-core-engine @runtest
